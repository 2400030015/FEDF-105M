<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCAL_SESSION STORAGE</title>
</head>
<body>
  <script>
  // Save data
  localStorage.setItem("name", "Venki");
  sessionStorage.setItem("course", "JavaScript");

  // Get data
  console.log(localStorage.getItem("name"));      // Venki
  console.log(sessionStorage.getItem("course"));  // JavaScript

  // Comment out remove to see in DevTools
  // localStorage.removeItem("name");
</script>

</body>
</html>
